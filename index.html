<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trener">
<meta name="theme-color" content="#f2f2f7">
<title>Trener</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="version.js"></script>
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--label:#000;--sec:#6c6c70;--ter:#aeaeb2;--sep:rgba(60,60,67,.16);
  --fill:rgba(120,120,128,.12);--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;
  --bar:rgba(249,249,249,.82);
}
:root[data-mode=dark]{color-scheme:dark;
  --bg:#000;--card:#1c1c1e;--label:#fff;--sec:#8e8e93;--ter:#48484a;--sep:rgba(84,84,88,.55);
  --fill:rgba(120,120,128,.24);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --bar:rgba(29,29,30,.82);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.screen{max-width:720px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 110px}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.4px;margin:18px 0 12px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.2px;color:var(--sec);margin:24px 16px 6px}
.sub{color:var(--sec);font-size:15px}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin:0 -4px}
.lnk{color:var(--blue);font-size:17px;padding:8px 4px}
.lnk.b{font-weight:600}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 6px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
:root[data-mode=dark] .seg button.on{background:#636366}
.search{width:100%;border:0;background:var(--fill);border-radius:10px;padding:8px 12px;font-size:17px;margin:6px 0 2px;outline:0}
.search::placeholder{color:var(--sec)}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;width:100%;text-align:left;min-height:46px}
.row+.row::before,.rowc+.row::before,.row+.rowc::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.grp>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.grp>*{position:relative}
.row .main{flex:1;min-width:0}
.row .t{display:block;overflow-wrap:anywhere}
.row .s{display:block;color:var(--sec);font-size:14px;margin-top:1px}
.chev{color:var(--ter);font-size:20px;line-height:1}
.pill{min-width:32px;text-align:center;font-weight:600;font-size:15px;border-radius:8px;padding:2px 7px;color:#fff;font-variant-numeric:tabular-nums}
.pill.g{background:var(--green)}.pill.o{background:var(--orange)}.pill.r{background:var(--red)}.pill.n{background:var(--fill);color:var(--sec)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;flex:none}
.av.big{width:64px;height:64px;font-size:24px}
.empty{color:var(--sec);text-align:center;padding:28px 16px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;font-weight:600;border-radius:12px;padding:13px;text-align:center;margin:14px 0 0}
.btn.sec{background:var(--card);color:var(--blue)}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 max(6px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
.tabbar>div{display:flex;width:100%;max-width:720px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sec);font-weight:500}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stats{display:flex;gap:10px;margin:8px 0}
.stat{flex:1;background:var(--card);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sec)}
.bar{flex:0 0 90px;height:7px;background:var(--fill);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.bar i.g{background:var(--green)}.bar i.o{background:var(--orange)}.bar i.r{background:var(--red)}
.d{font-size:12px;font-weight:600;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.d.up{color:var(--green)}.d.dn{color:var(--red)}.d.eq{color:var(--ter)}
.val{width:28px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.note{align-items:flex-start}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ter);flex:none;display:grid;place-items:center;margin-top:1px;color:#fff;font-size:14px}
.chk.on{background:var(--blue);border-color:var(--blue)}
.done{color:var(--sec);text-decoration:line-through}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.ov.in{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .25s}
.ov.in .sheet{transform:none}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:14px;max-height:86vh}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:.5px solid var(--sep);background:var(--card);border-radius:14px 14px 0 0;gap:8px}
.sh-h b{font-weight:600;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-b{overflow:auto;padding:8px 16px 28px}
.rowc{padding:10px 16px;display:block;background:var(--card)}
.rowc .rl{display:flex;justify-content:space-between}
.rowc textarea,.rowc input[type=text]{width:100%;border:0;background:transparent;outline:0;resize:vertical;padding:4px 0}
.fgrp{background:var(--card);border-radius:12px;overflow:hidden;margin-top:8px}
.fgrp>*{position:relative}
.fgrp>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--card)}
.fl input,.fl select{border:0;background:transparent;text-align:right;outline:0;min-width:0;flex:1;color:var(--blue)}
.fl span{white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--blue);margin:6px 0 2px}
.del{display:block;width:100%;margin-top:18px;background:var(--card);color:var(--red);border-radius:12px;padding:13px;text-align:center}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;font-variant-numeric:tabular-nums}
.tw{overflow:auto;background:var(--card);border-radius:12px}
.tbl th,.tbl td{padding:6px 8px;text-align:center;white-space:nowrap;border-bottom:.5px solid var(--sep)}
.tbl th{font-weight:600;font-size:12px;color:var(--sec);background:var(--card);position:sticky;top:0}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--card);text-align:left;z-index:1;min-width:110px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.tbl input{width:44px;text-align:center;border:0;background:var(--fill);border-radius:6px;padding:4px 0;outline:0}
.tbl tr:last-child td{border-bottom:0}
.rk{color:var(--sec);width:26px}
.tot{font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(60,60,67,.95);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:40}
svg.sp{width:60px;height:20px;flex:none}

/* ===== tema-system og ekstra utforming ===== */
:root{--hero:linear-gradient(135deg,#0a84ff,#5e5ce6);--shadow:0 0 0 transparent;--rad:12px;--cardbd:transparent;--bgimg:none;--sheet:var(--bg);--btn:var(--blue);--chipbg:rgba(255,255,255,.2);--solid:var(--card)}
body{background-image:var(--bgimg);background-attachment:fixed}
.grp,.stat,.tw,.card{border-radius:var(--rad);box-shadow:var(--shadow);border:1px solid var(--cardbd)}
.card{background:var(--card);padding:10px;margin:12px 0}
.sheet{background:var(--sheet)}
.btn{background:var(--btn)}
.btn.sec{background:var(--card);color:var(--blue)}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.row:active{background:var(--fill)}
.tbl th,.tbl td:first-child,.tbl th:first-child{background:var(--solid)}
.hrow{display:flex;align-items:center;justify-content:space-between}
.tbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.3);background:var(--sw);flex:none}
.hero{position:relative;overflow:hidden;color:#fff;background:var(--hero);border-radius:calc(var(--rad) + 8px);padding:18px 18px 16px;margin:10px 0 6px;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.hero::before{content:"";position:absolute;right:-50px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hl{font-size:12.5px;opacity:.88;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.hb{font-size:54px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.hb small{font-size:18px;font-weight:600;letter-spacing:0;opacity:.9}
.hc{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--chipbg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:6px 12px}
.chip b{display:block;font-size:17px;font-weight:700}
.chip span{font-size:11.5px;opacity:.9}
.tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pill{border-radius:999px;padding:2px 9px}
.anim{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.th{background:var(--card);border:2px solid transparent;border-radius:14px;padding:8px;text-align:left;box-shadow:var(--shadow)}
.th.on{border-color:var(--blue)}
.th i{display:block;height:54px;border-radius:9px;margin-bottom:6px}
.th b{font-size:15px}
.ringrow{margin-left:auto}

/* Bane */
:root[data-theme=pitch]{color-scheme:light;--bg:#e8f0e8;--card:#fff;--label:#0f1f14;--sec:#5d6f62;--ter:#a8b5ab;--sep:rgba(15,60,30,.12);--fill:rgba(20,80,40,.08);--blue:#0b8f4d;--green:#16a34a;--orange:#f59e0b;--red:#e11d48;--bar:rgba(255,255,255,.9);--hero:repeating-linear-gradient(90deg,#10803f 0 46px,#0b6b3a 46px 92px);--shadow:0 2px 10px rgba(20,80,40,.09);--rad:18px;--btn:linear-gradient(135deg,#0b8f4d,#16b866);--chipbg:rgba(255,255,255,.2)}
:root[data-theme=pitch] .hero{outline:2px solid rgba(255,255,255,.55);outline-offset:-10px}
:root[data-theme=pitch] .hero::before{background:none;border:2px solid rgba(255,255,255,.4);right:-40px;top:-40px;width:150px;height:150px}
:root[data-theme=pitch] .hero::after{display:none}
:root[data-theme=pitch] .seg button.on{background:#fff}
/* Hall (håndball) */
:root[data-theme=hall]{color-scheme:light;--bg:#e8eef8;--card:#fff;--label:#0e1a33;--sec:#5b6785;--ter:#a9b3cc;--sep:rgba(20,40,100,.11);--fill:rgba(30,60,160,.08);--blue:#1f5fe0;--green:#16a34a;--orange:#f59e0b;--red:#e11d48;--bar:rgba(255,255,255,.9);--hero:linear-gradient(135deg,#1e3a8a,#2563eb 70%,#3b82f6);--shadow:0 2px 10px rgba(30,60,160,.1);--rad:18px;--btn:linear-gradient(135deg,#1d4ed8,#3b82f6);--chipbg:rgba(255,255,255,.18)}
:root[data-theme=hall] .hero{outline:2px solid rgba(255,255,255,.5);outline-offset:-10px}
:root[data-theme=hall] .hero::before{background:none;border:3px solid #ffb347;width:200px;height:200px;right:-70px;top:auto;bottom:-120px}
:root[data-theme=hall] .hero::after{background:none;border:2px dashed rgba(255,255,255,.45);width:290px;height:290px;left:auto;right:-115px;bottom:-165px}
:root[data-theme=hall] .seg button.on{background:#fff}
:root[data-theme=pitch][data-mode=dark]{color-scheme:dark;--bg:#07120b;--card:#11231a;--label:#e9f6ee;--sec:#8fa89a;--ter:#4b6154;--sep:rgba(160,225,190,.16);--fill:rgba(120,210,155,.13);--blue:#2fd27f;--green:#34d27b;--orange:#fbbf24;--red:#fb7185;--bar:rgba(9,22,15,.9);--shadow:0 2px 10px rgba(0,0,0,.45);--btn:linear-gradient(135deg,#0f8a4d,#19b866)}
:root[data-theme=hall][data-mode=dark]{color-scheme:dark;--bg:#070d1c;--card:#101a33;--label:#e8eeff;--sec:#93a0c4;--ter:#4a5678;--sep:rgba(150,175,255,.17);--fill:rgba(110,140,255,.14);--blue:#5b8cff;--green:#34d27b;--orange:#fbbf24;--red:#fb7185;--bar:rgba(9,15,32,.9);--shadow:0 2px 10px rgba(0,0,0,.45);--btn:linear-gradient(135deg,#2358e6,#4b86ff)}
:root[data-mode=dark][data-theme] .seg button.on{background:#3a4357}
:root[data-mode=dark]{--s1:#3a86e0;--s2:#dd5c35;--s3:#1ca06e;--s4:#b87d00;--s5:#d45a8a}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lk-t{font-size:34px;font-weight:700}
.lk-d{display:flex;gap:14px;margin:8px 0 12px}.lk-d i{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue)}.lk-d i.on{background:var(--blue)}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.lk-pad button{height:76px;border-radius:50%;background:var(--fill);font-size:28px;font-weight:500}
.lk-pad button:active{background:var(--ter)}
.sb{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sb button{background:var(--fill);border-radius:10px;padding:6px 10px;font-size:15px;min-width:56px}
.sb button.has{background:var(--blue);color:#fff}
.sb.dec button{outline:2px solid var(--red);outline-offset:-2px}
.mk .on.i{background:var(--ter);color:#fff}
.nag{display:block;width:100%;text-align:left;background:rgba(245,158,11,.18);color:var(--label);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 8px}
/* statistikk */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sec);margin-bottom:4px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
svg.ch{width:100%;display:block;touch-action:pan-y}
svg.ch .hl{transition:filter .1s}.hl.on{filter:brightness(1.15)}
#tip{position:fixed;z-index:50;background:var(--label);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px;pointer-events:none;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:240px}
#tip .tt{opacity:.75;font-size:12px;margin-bottom:3px}
#tip .tr{display:flex;align-items:center;gap:8px}
#tip .tr i{width:12px;height:3px;border-radius:2px;flex:none}
#tip .tr b{font-variant-numeric:tabular-nums}
#tip .tr span{opacity:.8}
details.tv{margin-top:8px;font-size:14px}
details.tv summary{color:var(--blue);cursor:pointer;padding:4px 0}
.hm td{padding:3px}
.hm .c{min-width:34px;height:30px;border-radius:6px;text-align:center;font-weight:600;font-size:12.5px;line-height:30px}
.hm th:not(:first-child){writing-mode:vertical-rl;transform:rotate(180deg);height:92px;font-size:12px;padding:6px 4px;vertical-align:bottom}
/* hurtiglogg */
.qrow{display:flex;gap:8px}
.qin{flex:1;min-width:0;border:0;background:var(--fill);border-radius:10px;padding:10px 12px;outline:0;font-size:16px}
.qadd{width:46px;border-radius:10px;background:var(--btn);color:#fff;font-size:24px;line-height:1}
.qtags{display:flex;gap:8px;margin-top:8px}
.qtags button{flex:1;padding:7px 4px;border-radius:9px;background:var(--fill);font-size:13px}
.qtags button.on{background:var(--blue);color:#fff}
.dots{display:flex;gap:5px;margin-top:10px;align-items:center;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%}
.dot.pos{background:var(--green)}.dot.neu{background:var(--ter)}.dot.warn{background:var(--orange)}
.tag{font-size:20px;width:30px;text-align:center;flex:none}
.badge{font-size:12px;font-weight:600;color:var(--orange)}
.dot.abs{background:var(--red)}
.mk{display:flex;gap:6px}
.mk button{width:40px;height:40px;border-radius:9px;background:var(--fill);font-size:16px}
.mk .on.p{background:var(--green);color:#fff}.mk .on.l{background:var(--orange);color:#fff}.mk .on.a{background:var(--red);color:#fff}
/* flytende tab-bar */
.tabbar{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:28px;border:1px solid var(--cardbd);padding:8px 0;box-shadow:0 10px 30px rgba(0,0,0,.22)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const VER=(typeof APP_VERSION!=='undefined'?APP_VERSION:'dev'),VDATE=(typeof APP_DATE!=='undefined'?APP_DATE:''),VCH=(typeof APP_CHANGES!=='undefined'?APP_CHANGES:[]);
/* ---------- util ---------- */
const KEY='trener.v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const MN=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
function fd(s){if(!s)return 'Uten dato';const [y,m,d]=s.split('-');return (+d)+'. '+MN[+m-1]+(+y!==new Date().getFullYear()?' '+y:'')}
const n1=v=>(Math.round(v*10)/10).toString().replace('.',',');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const cls=v=>v>=8?'g':v>=6?'o':'r';
const SPORTS={handball:'Håndball',football:'Fotball'};
const CATS=['Oppvarming','Teknikk','Spill','Forsvar','Lek og konkurranse','Fysisk','Annet'];
const GROUPS=['Teknisk','Sosialt og holdning','Spesifikt og fysisk','Spill og lederskap','Keeper'];
/* Standardkriterier per idrett: [navn, gruppe-indeks, o=kun utespillere]. Brukes ved ny start og legges til (aldri fjernes) ved oppgradering. */
function defCrit(sp){
  const T=0,S=1,F=2,P=3,K=4,out=[];
  const add=(g,list,o)=>list.forEach(n=>out.push([n,g,o?1:0]));
  if(sp==='football'){
    add(T,['Pasning','Mottak','Førsteberøring','Ballkontroll']);
    add(T,['Dribling','Hodespill','Forsvarsteknikk'],1);
    add(P,['Overblikk','Samspill','Spilleforståelse','Posisjonsspill','Lederskap (kapteinstype)','Kommunikasjon']);
    add(P,['Press'],1);
    add(S,['Fokus','Innsats','Holdning','Punktlighet','Lagspiller','Lytter til instruks','Trenbarhet','Tøffhet']);
    add(F,['Fart','Løpskraft','Spenst','Utholdenhet','Styrke','Balanse og koordinasjon']);

let db;
function migrate(d){
  d.attendance=d.attendance||[];d.matches=d.matches||[];d.players.forEach(p=>{p.log=p.log||[]});
  if((d.v||1)<2){
    Object.keys(d.criteria).forEach(sp=>{const cr=d.criteria[sp];
      const l=cr.find(c=>c.n==='Lagspill');
      if(l){l.n='Lagspiller';d.players.filter(p=>p.sport===sp).forEach(p=>p.assessments.forEach(a=>{if('Lagspill' in a.scores){a.scores.Lagspiller=a.scores.Lagspill;delete a.scores.Lagspill}}))}
      ['Punktlighet','Holdning'].forEach(n=>{if(!cr.some(c=>c.n===n)){const i=cr.findIndex(c=>c.n==='Innsats');cr.splice(i>=0?i+1:cr.length,0,{n,g:'Sosialt og holdning'})}});
    });
    d.v=2;
  }
  if((d.v||1)<3){
    Object.keys(d.criteria).forEach(sp=>{const cr=d.criteria[sp],def=defCrit(sp);
      def.forEach(c=>{
        const ex=cr.find(x=>x.n===c.n);
        if(ex){if(c.o&&ex.o==null)ex.o=1;return}
        let at=-1;cr.forEach((x,i)=>{if(x.g===c.g)at=i});
        cr.splice(at>=0?at+1:cr.length,0,c);
      });
    });
    d.v=3;
  }
  if((d.v||1)<4){
    (d.plans||[]).forEach(p=>(p.items||[]).forEach(i=>{if(!i.exId&&i.text){const e=exIn(d,p.sport,i.text,'Annet');i.exId=e.id;delete i.text}}));
    d.v=4;
  }
  delete d.theme;return d;
}

function radar(items){

function fslots(m){const k=LU(m).sys;return m.sport==='football'?frows(k):(FHB[k]||FHB['6-0']).s}

function LU(m){if(!m.lineup)m.lineup={sys:m.sport==='football'?'4-3-3':'6-0',slots:{},bench:[]};if(!m.lineup.bench)m.lineup.bench=[];if(!m.lineup.slots)m.lineup.slots={};return m.lineup}
function slotOf(lu,id){return Object.keys(lu.slots).find(k=>lu.slots[k]===id)}
function lineupTxt(m,id){
  if(!m.lineup)return '';const lu=m.lineup,k=slotOf(lu,id);
  if(k!=null){const l=((m.sport==='football'?frows(lu.sys):(FHB[lu.sys]||FHB['6-0']).s)[+k]||[])[2];return 'Startet'+(l?' · '+(l==='K'?'Keeper':l):'')}
  return lu.bench.includes(id)?'Benk':'';
}
function addRoster(m,id){m.roster=m.roster||[];if(!m.roster.includes(id))m.roster.push(id);m.players[id]=m.players[id]||{effort:0,good:'',work:''}}
function setSlot(m,i,pid){
  const lu=LU(m),prev=lu.slots[i];
  if(pid){
    const from=slotOf(lu,pid);lu.bench=lu.bench.filter(x=>x!==pid);
    if(from!=null){if(prev)lu.slots[from]=prev;else delete lu.slots[from]}else if(prev)lu.bench.push(prev);
    lu.slots[i]=pid;addRoster(m,pid);if(prev)addRoster(m,prev);
  }else if(prev){lu.bench.push(prev);delete lu.slots[i]}
}
function tok(sl,i,pid,fb){
  const x=sl[0],y=sl[1],l=sl[2]||'',p=pid&&byId(db.players,pid);
  const tx='font-family="-apple-system,system-ui,sans-serif" text-anchor="middle" paint-order="stroke" stroke="rgba(0,0,0,.55)" stroke-linejoin="round"';
  if(!p)return '<g data-a="slot" data-id="'+i+'" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="5.6" fill="rgba(255,255,255,.16)" stroke="#fff" stroke-width=".7" stroke-dasharray="2 1.6"/><text x="'+x+'" y="'+(y+1.9)+'" font-size="5.5" fill="#fff" '+tx+' stroke-width="0">+</text><text x="'+x+'" y="'+(y+10.5)+'" font-size="3.3" fill="#fff" '+tx+' stroke-width=".7">'+esc(l==='K'?'Keeper':l)+'</text></g>';
  const ini=p.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(),nm=p.name.split(/\s+/)[0].slice(0,9);
  return '<g data-a="slot" data-id="'+i+'" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="5.8" fill="'+(i===0?'#f5b301':'hsl('+hue(p.name)+' 55% 52%)')+'" stroke="#fff" stroke-width="1"/><text x="'+x+'" y="'+(y+1.7)+'" font-size="4.6" font-weight="700" fill="'+(i===0?'#1d1d1f':'#fff')+'" '+tx+' stroke-width="0">'+esc(ini)+'</text><text x="'+x+'" y="'+(y+10.5)+'" font-size="3.5" font-weight="600" fill="#fff" '+tx+' stroke-width=".8">'+esc(nm)+'</text>'+(p.inj?'<text x="'+(x+4.6)+'" y="'+(y-3.6)+'" font-size="4.4" text-anchor="middle">🩹</text>':'')+'</g>';
}
function pitchSvg(m){
  const lu=LU(m),S=fslots(m),fb=m.sport==='football',top=!fb&&(FHB[lu.sys]||{}).top;
  let g;
  if(fb){
    g='<rect width="100" height="140" fill="#2f9d57"/>';
    for(let i=0;i<7;i+=2)g+='<rect x="0" y="'+(i*20)+'" width="100" height="20" fill="rgba(255,255,255,.05)"/>';
    const L='fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".7"';
    g+='<rect x="3" y="3" width="94" height="134" '+L+'/><line x1="3" y1="70" x2="97" y2="70" '+L+'/><circle cx="50" cy="70" r="11" '+L+'/><rect x="24" y="3" width="52" height="21" '+L+'/><rect x="38" y="3" width="24" height="8" '+L+'/><rect x="24" y="116" width="52" height="21" '+L+'/><rect x="38" y="129" width="24" height="8" '+L+'/><rect x="43" y="0" width="14" height="3" '+L+'/><rect x="43" y="137" width="14" height="3" '+L+'/>';
  }else{
    const L='fill="none" stroke="rgba(255,255,255,.85)" stroke-width=".8"';
    g='<g'+(top?' transform="rotate(180 50 50)"':'')+'><rect width="100" height="100" fill="#2d5fc9"/><rect x="2" y="2" width="96" height="96" '+L+'/><path d="M20,98 A30,30 0 0 1 80,98 Z" fill="rgba(255,179,71,.85)" stroke="#fff" stroke-width=".8"/><path d="M5,98 A45,45 0 0 1 95,98" '+L+' stroke-dasharray="3 2"/><line x1="46" y1="63" x2="54" y2="63" '+L+'/><line x1="47" y1="78" x2="53" y2="78" '+L+'/><rect x="44" y="98" width="12" height="2" fill="#fff"/></g>';
  }
  g+=S.map((sl,i)=>tok(sl,i,lu.slots[i],fb)).join('');
  return '<svg viewBox="0 0 100 '+(fb?140:100)+'" role="img" aria-label="Laguppstilling" style="width:100%;max-width:520px;height:auto;display:block;margin:0 auto;border-radius:16px;touch-action:manipulation">'+g+'</svg>';
}
function lineupBlock(m){
  const lu=LU(m),S=fslots(m),placed=Object.keys(lu.slots).length;
  let h='<h2>Laguppstilling</h2><div class="grp"><button class="row" data-a="lsys"><div class="main"><span class="t">Formasjon</span></div><span class="sub">'+esc(fname(m,lu.sys))+'</span><span class="chev">›</span></button></div>';
  h+='<div class="card" style="padding:8px;margin-top:10px">'+pitchSvg(m)+'<div class="sub" style="text-align:center;margin:8px 0 2px">'+placed+' av '+S.length+' plasser fylt · trykk på en plass for å velge spiller</div></div>';
  h+='<h2>Benk'+(lu.bench.length?' · '+lu.bench.length:'')+'</h2><div class="grp">'+lu.bench.map(id=>{const p=byId(db.players,id);return p?'<div class="row">'+av(p.name)+'<div class="main"><span class="t">'+esc(p.name)+'</span>'+(p.pos?'<span class="s">'+esc(p.pos)+'</span>':'')+'</div></div>':''}).join('')+'<button class="row" data-a="lbench"><span class="lnk">＋ Velg benk</span></button></div>';
  return h;
}
const MSTAT={football:[['goals','⚽','Mål'],['assists','🅰️','Målgivende'],['saves','🧤','Redninger'],['yellow','🟨','Gult kort'],['red','🟥','Rødt kort']],handball:[['goals','🤾','Mål'],['assists','🅰️','Målgivende'],['saves','🧤','Redninger'],['min2','2 min','2 minutter'],['yellow','🟨','Gult kort'],['red','🟥','Rødt kort']]};
function statBlock(m){
  const ro=(m.roster||[]).map(id=>byId(db.players,id)).filter(Boolean);
  if(!ro.length)return '';
  const keys=MSTAT[m.sport]||MSTAT.football,dec=Q.statdec;
  const tot=k=>ro.reduce((s,p)=>s+((m.players[p.id]||{})[k]||0),0);
  let h='<h2>Kampstatistikk</h2><div class="seg"><button class="'+(dec?'':'on')+'" data-a="statmode" data-id="">＋ Legg til</button><button class="'+(dec?'on':'')+'" data-a="statmode" data-id="1">− Fjern</button></div><div class="grp">';
  h+=ro.map(p=>{const x=m.players[p.id]||{};return '<div><div class="row" style="padding-bottom:4px">'+av(p.name)+'<span class="main t">'+esc(p.name)+'</span></div><div class="sb'+(dec?' dec':'')+'">'+keys.filter(k=>k[0]!=='saves'||isKeeperish(p)).map(k=>'<button class="'+(x[k[0]]?'has':'')+'" data-a="stat" data-p="'+p.id+'" data-id="'+k[0]+'" title="'+k[2]+'">'+k[1]+' '+(x[k[0]]||0)+'</button>').join('')+'</div></div>'}).join('')+'</div>';
  h+='<p class="sub" style="margin:6px 16px">Totalt: '+keys.filter(k=>tot(k[0])).map(k=>k[1]+' '+tot(k[0])).join(' · ')+(keys.some(k=>tot(k[0]))?'':'ingen registrert ennå')+'. Trykk på en knapp for å registrere.</p>';
  return h;
}
function kampStat(p){
  const keys=MSTAT[p.sport]||MSTAT.football,sum=k=>db.matches.reduce((s,m)=>s+(((m.players||{})[p.id]||{})[k]||0),0);
  const v=keys.map(k=>[k,sum(k[0])]).filter(x=>x[1]>0);
  if(!v.length)return '';
  return '<h2>Kampstatistikk</h2><div class="stats" style="margin-top:0;flex-wrap:wrap">'+v.map(([k,n])=>'<div class="stat"><b>'+n+'</b><span>'+k[1]+' '+k[2]+'</span></div>').join('')+'</div>';
}

  return h+'<p class="sub" style="margin:10px 16px">Tallet til høyre er innsats (1–10).</p>';

/* ---------- skjema-ark ---------- */
function closeSheet(){document.querySelectorAll('.ov').forEach(o=>o.remove())}
function openSheet(inner){closeSheet();const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="sheet">'+inner+'</div>';o.addEventListener('mousedown',e=>{if(e.target===o)closeSheet()});document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add('in'));return o}
let FORM=null;
function openForm(o){
  FORM=o;
  let body='',open=false;
  const close=()=>{if(open){body+='</div>';open=false}};
  const start=()=>{if(!open){body+='<div class="fgrp">';open=true}};
  o.fields.forEach(f=>{
    if(f.h){close();body+=`<h2 style="margin-top:18px">${esc(f.h)}</h2>`;return}
    start();
    const v=f.value==null?'':f.value;
    if(f.type==='area')body+=`<div class="rowc"><span class="sub">${esc(f.label)}</span><textarea name="${f.k}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==='range')body+=`<div class="rowc"><div class="rl"><span>${esc(f.label)}</span><b class="rv">${v?v:'–'}</b></div><input type="range" min="${f.min==null?1:f.min}" max="10" step="1" name="${f.k}" value="${v||f.min||5}" data-min="${f.min==null?1:f.min}"></div>`;
    else if(f.type==='select')body+=`<label class="fl"><span>${esc(f.label)}</span><select name="${f.k}">${f.options.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
    else body+=`<label class="fl"><span>${esc(f.label)}</span><input name="${f.k}" type="${f.type==='num'?'number':f.type==='date'?'date':'text'}" ${f.type==='num'?'inputmode="numeric"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}"></label>`;
  });
  close();
  const el=openSheet(`<div class="sh-h"><button class="lnk" data-a="close">Avbryt</button><b>${esc(o.title)}</b><button class="lnk b" data-a="fsave">${o.saveLabel||'Lagre'}</button></div><div class="sh-b"><form id="f" onsubmit="return false">${body}</form>${o.del?`<button class="del" data-a="fdel">${o.delLabel||'Slett'}</button>`:''}</div>`);
  const first=el.querySelector('input[type=text],input:not([type]),textarea');if(first&&!o.noFocus&&!('ontouchstart' in window))first.focus();
}
function collect(){
  const form=document.getElementById('f'),v={};
  FORM.fields.forEach(f=>{if(f.h)return;const el=form.elements[f.k];if(!el)return;
    if(f.type==='range')v[f.k]=+el.value<(+el.dataset.min)?0:+el.value;
    else if(f.type==='num')v[f.k]=el.value===''?null:+el.value;
    else v[f.k]=el.value.trim()});
  return v;
}
function openPick(o){
  FORM={pick:o};
  let b='';
  o.groups.forEach(g=>{b+=`<h2>${esc(g.h)}</h2><div class="grp">`+g.items.map(i=>`<label class="row" style="cursor:pointer"><input type="checkbox" value="${i.id}" ${i.on?'checked':''} style="width:20px;height:20px;accent-color:var(--blue)"><div class="main"><span class="t">${esc(i.label)}</span>${i.sub?`<span class="s">${esc(i.sub)}</span>`:''}</div></label>`).join('')+'</div>'});
  openSheet(`<div class="sh-h"><button class="lnk" data-a="close">Avbryt</button><b>${esc(o.title)}</b><button class="lnk b" data-a="psave">${o.okLabel||'Ferdig'}</button></div><div class="sh-b" id="pk">${b||'<div class="empty">Ingenting å velge</div>'}</div>`);
}

/* ---------- statistikk ---------- */
const CH={};let chN=0;
const SER=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];
const inR=d=>{const r=Q.range||'all';if(r==='all')return true;return !!d&&d>=daysAgo(+r)};
const f1=v=>v==null?'–':n1(v);
const sd=d=>fd(d).replace(/ \d{4}$/,'');
const signed=v=>v==null?'–':(v>0?'+':v<0?'−':'±')+n1(Math.abs(v));

function tableView(head,rows){
  return '<details class="tv"><summary>Vis som tabell</summary><div class="tw"><table class="tbl"><thead><tr>'+head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>';
}
function legend(series){
  if(series.length<2)return '';
  return '<div class="lg">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>';
}
function axisSvg(o){
  const W=420,H=190,L=34,Rr=12,T=14,B=28,iw=W-L-Rr,ih=H-T-B,n=o.xs.length;
  const min=o.min==null?0:o.min,max=o.max==null?10:o.max;
  const Y=v=>T+ih-(v-min)/(max-min)*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=min+(max-min)*k/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--sep)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" font-size="10.5" fill="var(--sec)" text-anchor="end">'+(o.yfmt?o.yfmt(v):n1(v))+'</text>'}
  return {W,H,L,Rr,T,B,iw,ih,n,min,max,Y,g};
}
function xLabels(a,pos,xs){
  const step=Math.max(1,Math.ceil(xs.length/6));let g='';
  xs.forEach((x,i)=>{if(i%step===0||i===xs.length-1&&(xs.length-1)%step>=step/2)g+='<text x="'+pos[i]+'" y="'+(a.H-8)+'" font-size="10.5" fill="var(--sec)" text-anchor="'+(i===xs.length-1&&xs.length>1?'end':'middle')+'">'+esc(x)+'</text>'});
  return g;
}
function lineChart(o){
  const a=axisSvg(o),id='c'+(++chN),n=a.n;
  const pos=o.xs.map((_,i)=>n===1?a.L+a.iw/2:a.L+i*a.iw/(n-1));
  let g=a.g+xLabels(a,pos,o.xs);
  o.series.forEach(s=>{
    let d='',pen=false;
    s.pts.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+pos[i].toFixed(1)+' '+a.Y(v).toFixed(1)+' ';pen=true});
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    s.pts.forEach((v,i)=>{if(v!=null)g+='<circle cx="'+pos[i].toFixed(1)+'" cy="'+a.Y(v).toFixed(1)+'" r="4" fill="'+s.color+'" stroke="var(--card)" stroke-width="2"/>'});
  });
  g+='<line class="xh" y1="'+a.T+'" y2="'+(a.T+a.ih)+'" x1="0" x2="0" stroke="var(--ter)" stroke-width="1" style="display:none"/>';
  CH[id]={W:a.W,pos,line:true,tip:i=>({t:o.tt?o.tt(i):o.xs[i],rows:o.series.filter(s=>s.pts[i]!=null).map(s=>[s.color,s.name,(o.vfmt||f1)(s.pts[i])]).concat(o.extra?o.extra(i):[])})};
  return legend(o.series)+'<svg class="ch" data-chart="'+id+'" viewBox="0 0 '+a.W+' '+a.H+'" role="img" aria-label="'+esc(o.label||'Linjediagram')+'">'+g+'</svg>';
}
function barsChart(o){
  const a=axisSvg(Object.assign({xs:o.items},o)),id='c'+(++chN),n=o.items.length,band=a.iw/n,bw=Math.min(28,band*.62);
  const pos=o.items.map((_,i)=>a.L+band*(i+.5));
  let g=a.g+xLabels(a,pos,o.items.map(x=>x.x));
  const y0=a.Y(Math.max(a.min,0));
  o.items.forEach((it,i)=>{
    const y=a.Y(it.v),top=Math.min(y,y0),h=Math.max(1,Math.abs(y0-y));
    g+='<rect class="hl" data-i="'+i+'" x="'+(pos[i]-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="'+it.color+'"/>';
    if(n<=14)g+='<text x="'+pos[i].toFixed(1)+'" y="'+(it.v>=0?top-4:top+h+11).toFixed(1)+'" font-size="10.5" font-weight="600" fill="var(--label)" text-anchor="middle">'+esc((o.vfmt||f1)(it.v))+'</text>';
  });
  if(a.min<0)g+='<line x1="'+a.L+'" x2="'+(a.W-a.Rr)+'" y1="'+y0+'" y2="'+y0+'" stroke="var(--ter)"/>';
  CH[id]={W:a.W,pos,tip:i=>o.items[i].tip};
  return '<svg class="ch" data-chart="'+id+'" viewBox="0 0 '+a.W+' '+a.H+'" role="img" aria-label="'+esc(o.label||'Søylediagram')+'">'+g+'</svg>';
}
function hbars(items,max){
  return '<div class="grp">'+items.map(it=>'<div class="row"><div class="main"><span class="t">'+esc(it.l)+'</span>'+(it.s?'<span class="s">'+esc(it.s)+'</span>':'')+'</div><div class="bar"><i style="width:'+(it.v/max*100)+'%;background:var(--s1)"></i></div><span class="val">'+f1(it.v)+'</span></div>').join('')+'</div>';
}
function card(title,sub,body){return '<h2>'+title+'</h2><div class="card" style="margin-top:0">'+(sub?'<div class="sub" style="margin-bottom:8px">'+sub+'</div>':'')+body+'</div>'}

/* tooltip / hover */
function hideTip(){const el=document.getElementById('tip');if(el)el.style.display='none';document.querySelectorAll('.xh').forEach(x=>x.style.display='none');document.querySelectorAll('.hl.on').forEach(x=>x.classList.remove('on'))}
function showTip(t,x,y){
  let el=document.getElementById('tip');if(!el){el=document.createElement('div');el.id='tip';document.body.appendChild(el)}
  el.replaceChildren();
  const h=document.createElement('div');h.className='tt';h.textContent=t.t;el.appendChild(h);
  t.rows.forEach(r=>{const d=document.createElement('div');d.className='tr';const k=document.createElement('i');k.style.background=r[0];const v=document.createElement('b');v.textContent=r[2];const nm=document.createElement('span');nm.textContent=r[1];d.append(k,v,nm);el.appendChild(d)});
  el.style.display='block';
  let l=x+14;if(l+el.offsetWidth>innerWidth-8)l=x-el.offsetWidth-14;
  el.style.left=Math.max(8,l)+'px';el.style.top=Math.max(8,y-el.offsetHeight-12)+'px';
}
function chartAt(e){
  const svg=e.target&&e.target.closest?e.target.closest('svg[data-chart]'):null;
  if(!svg){hideTip();return}
  const c=CH[svg.dataset.chart];if(!c)return;
  const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*c.W;
  let bi=0,bd=1e9;c.pos.forEach((p,i)=>{const d=Math.abs(p-x);if(d<bd){bd=d;bi=i}});
  const xh=svg.querySelector('.xh');if(xh&&c.line){xh.setAttribute('x1',c.pos[bi]);xh.setAttribute('x2',c.pos[bi]);xh.style.display=''}
  svg.querySelectorAll('.hl').forEach(el=>el.classList.toggle('on',+el.dataset.i===bi));
  showTip(c.tip(bi),e.clientX,e.clientY);
}
document.addEventListener('pointermove',chartAt);
document.addEventListener('pointerdown',chartAt);

/* ---------- beregninger ---------- */
function pStats(p){
  const as=p.assessments.slice().sort((a,b)=>a.date.localeCompare(b.date));
  let delta=null;
  if(as.length>1){const f=as[0].scores,l=as[as.length-1].scores,keys=Object.keys(l).filter(k=>k in f);if(keys.length)delta=avg(keys.map(k=>l[k]))-avg(keys.map(k=>f[k]))}
  const ef=db.matches.filter(m=>(m.roster||[]).includes(p.id)).map(m=>(m.players[p.id]||{}).effort).filter(x=>x>0);
  return {p,avg:playerAvg(p),delta,att:attStats(p).pct,ef:avg(ef),warn:recentLog(p,30).filter(x=>x.tag==='warn').length,n:as.length};
}
function exByDate(){
  const ses=db.exercises.filter(e=>e.sport===db.sport).flatMap(e=>e.sessions.filter(s=>s.date&&s.score!=null&&inR(s.date)).map(s=>({d:s.date,v:s.score,n:e.name})));
  const dates=[...new Set(ses.map(s=>s.d))].sort();
  return {dates,rows:dates.map(d=>{const x=ses.filter(s=>s.d===d);return {d,avg:avg(x.map(s=>s.v)),n:x.length}})};
}
function trendDelta(vals){ // snitt siste 3 mot de 3 før
  const v=vals.filter(x=>x!=null);if(v.length<4)return null;
  const k=Math.min(3,Math.floor(v.length/2));
  return avg(v.slice(-k))-avg(v.slice(-2*k,-k));
}

/* ---------- side ---------- */
function stats(){
  if(R.id==='settings')return more();
  const ps=sportPl(),exd=exByDate(),td=trendDelta(exd.rows.map(r=>r.avg));
  const ms=db.matches.filter(m=>m.sport===db.sport&&inR(m.date)).sort((a,b)=>a.date.localeCompare(b.date));
  let h='<div class="hrow"><h1>Statistikk</h1><button class="lnk" style="font-size:22px" data-a="settings" title="Innstillinger">⚙︎</button></div>'+backupNag()+segment();
  h+='<div class="seg">'+[['all','Alt'],['90','90 dager'],['30','30 dager']].map(([k,l])=>'<button class="'+((Q.range||'all')===k?'on':'')+'" data-a="range" data-id="'+k+'">'+l+'</button>').join('')+'</div>';
  const regs=exd.rows.reduce((s,r)=>s+r.n,0);
  h+=hero('Snittscore øvelser',exd.rows.length?f1(avg(exd.rows.map(r=>r.avg))):'–',[chip(exd.rows.length,'økter'),chip(regs,'registreringer'),chip(td==null?'–':signed(td),'trend siste økter')]);

  /* innsikt */
  const P=ps.map(pStats),ins=[];
  const exs=db.exercises.filter(e=>e.sport===db.sport).map(e=>({e,s:exStats(e)})).filter(x=>x.s.avg!=null);
  const best=exs.filter(x=>x.s.n>=2).sort((a,b)=>b.s.avg-a.s.avg)[0];
  if(best)ins.push(['⭐','Best rangerte øvelse: '+best.e.name+' ('+f1(best.s.avg)+' i snitt, '+best.s.n+' ganger)']);
  const used=exs.slice().sort((a,b)=>b.s.n-a.s.n)[0];
  if(used)ins.push(['🔁','Mest brukt: '+used.e.name+' ('+used.s.n+' ganger)']);
  if(td!=null)ins.push([td>=0?'📈':'📉','Øvelsesscore siste økter: '+signed(td)+' mot forrige periode']);
  const imp=P.filter(x=>x.delta!=null).sort((a,b)=>b.delta-a.delta);
  if(imp.length){ins.push(['🚀','Størst fremgang: '+imp[0].p.name+' ('+signed(imp[0].delta)+')']);if(imp.length>1&&imp[imp.length-1].delta<0)ins.push(['🔻','Størst nedgang: '+imp[imp.length-1].p.name+' ('+signed(imp[imp.length-1].delta)+')'])}
  const lowAtt=P.filter(x=>x.att!=null).sort((a,b)=>a.att-b.att)[0];
  if(lowAtt)ins.push(['🕒','Lavest oppmøte: '+lowAtt.p.name+' ('+lowAtt.att+' %)']);
  const never=P.filter(x=>!x.n).length;
  if(P.length&&never)ins.push(['📝',never+' av '+P.length+' spillere er ikke vurdert ennå']);
  if(ms.length){let st=0;for(let i=ms.length-1;i>=0;i--){const o=outcome(ms[i]);if(o==='W')st++;else break}if(st>=2)ins.push(['🔥','Seiersrekke: '+st+' på rad'])}
  h+='<h2>Innsikt</h2><div class="grp">'+(ins.length?ins.map(i=>'<div class="row"><span class="tag">'+i[0]+'</span><span class="main t">'+esc(i[1])+'</span></div>').join(''):'<div class="row"><span class="sub">Registrer mer for å få innsikt</span></div>')+'</div>';

  /* øvelser over tid */
  if(exd.rows.length){
    h+=card('Øvelsesscore over tid','Gjennomsnittlig score per treningsdag. Trykk eller hold over punktene for detaljer.',
      lineChart({xs:exd.rows.map(r=>sd(r.d)),series:[{name:'Snittscore',color:SER[0],pts:exd.rows.map(r=>r.avg)}],min:0,max:10,label:'Snittscore per treningsdag',tt:i=>fd(exd.rows[i].d),extra:i=>[['var(--ter)','øvelser',String(exd.rows[i].n)]]})
      +tableView(['Dato','Snitt','Øvelser'],exd.rows.map(r=>[fd(r.d),f1(r.avg),String(r.n)])));
  }
  const rank=exs.filter(x=>x.s.n>=2).sort((a,b)=>b.s.avg-a.s.avg);
  if(rank.length){
    const top=rank.slice(0,5),bot=rank.slice(-3).filter(x=>!top.includes(x)).reverse();
    h+='<h2>Øvelser: best og svakest</h2>'+hbars(top.map(x=>({l:x.e.name,s:x.s.n+' ganger',v:x.s.avg})),10);
    if(bot.length)h+='<div class="sub" style="margin:12px 16px 4px">Lavest rangert – vurder å justere eller droppe</div>'+hbars(bot.map(x=>({l:x.e.name,s:x.s.n+' ganger',v:x.s.avg})),10);
  }

  /* lagets utvikling per gruppe */
  const dates=[...new Set(ps.flatMap(p=>p.assessments.map(a=>a.date)))].filter(inR).sort();
  if(dates.length>=2){
    const ser=GROUPS.map((g,gi)=>({name:g,color:SER[gi],pts:dates.map(d=>{const v=[];ps.forEach(p=>p.assessments.filter(a=>a.date===d).forEach(a=>crit().filter(c=>c.g===g).forEach(c=>{if(a.scores[c.n]!=null)v.push(a.scores[c.n])})));return avg(v)})})).filter(x=>x.pts.some(v=>v!=null));
    h+=card('Lagets utvikling','Gjennomsnitt av alle vurderinger per gruppe, over tid.',lineChart({xs:dates.map(sd),series:ser,min:0,max:10,label:'Lagsnitt per kriteriegruppe',tt:i=>fd(dates[i])})+tableView(['Dato'].concat(ser.map(x=>x.name)),dates.map((d,i)=>[fd(d)].concat(ser.map(s=>f1(s.pts[i]))))));
  }else{
    const cs=crit().map(c=>({l:c.n,s:c.g,v:avg(ps.map(p=>series(p,c.n).pop()).filter(x=>x!=null))})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
    if(cs.length)h+=card('Lagets nivå nå','Snitt per kriterium. Gjør vurderinger på flere datoer for å se utvikling over tid.','')+hbars(cs,10);
  }

  /* oppmøte */
  const at=db.attendance.filter(a=>a.sport===db.sport&&inR(a.date)&&Object.keys(a.marks).length).sort((a,b)=>a.date.localeCompare(b.date));
  if(at.length){
    const items=at.map(a=>{const v=Object.values(a.marks),here=v.filter(x=>x!=='a').length,late=v.filter(x=>x==='l').length,pct=Math.round(here/v.length*100);return {x:sd(a.date),v:pct,color:SER[0],tip:{t:(a.title||'Trening')+' · '+fd(a.date),rows:[[SER[0],'oppmøte',pct+' %'],['var(--ter)','til stede',String(here)],['var(--ter)','for sent',String(late)],['var(--ter)','borte',String(v.length-here)]]}}});
    h+=card('Oppmøte per økt','Andel som møtte (inkludert de som kom for sent).',barsChart({items,min:0,max:100,yfmt:v=>Math.round(v),vfmt:v=>v+'',label:'Oppmøte per økt i prosent'})+tableView(['Økt','Dato','Oppmøte'],at.map((a,i)=>[a.title||'Trening',fd(a.date),items[i].v+' %'])));
  }

  /* kamper */
  const mr=ms.filter(m=>outcome(m));
  if(mr.length){
    const items=mr.map(m=>{const d=m.us-m.them;return {x:sd(m.date),v:d,color:d>=0?SER[0]:SER[1],tip:{t:'Mot '+(m.opponent||'?')+' · '+fd(m.date),rows:[[d>=0?SER[0]:SER[1],'resultat',m.us+'–'+m.them],['var(--ter)','innsats snitt',f1(matchEffort(m))],['var(--ter)','lagets spill',m.team&&m.team.rating?m.team.rating+'/10':'–']]}}});
    const mx=Math.max(3,...items.map(i=>Math.abs(i.v)))+1;
    h+=card('Kamper: måldifferanse','Blå søyle = seier eller uavgjort, oransje = tap.',barsChart({items,min:-mx,max:mx,yfmt:v=>Math.round(v),vfmt:signed,label:'Måldifferanse per kamp'})+tableView(['Kamp','Dato','Resultat','Innsats'],mr.map(m=>['Mot '+(m.opponent||'?'),fd(m.date),m.us+'–'+m.them,f1(matchEffort(m))])));
  }

  /* serie / turnering: poengutvikling */
  const comp=db.comps.filter(c=>c.sport===db.sport).pop();
  if(comp&&comp.rounds.length>=2){
    const rounds=comp.rounds.slice().sort((a,b)=>a.date.localeCompare(b.date)),top=totals(comp).slice(0,5);
    const ser=top.map((r,i)=>{let sum=0;return {name:r.name,color:SER[i],pts:rounds.map(rd=>(sum+=+(r.pt[rd.id])||0))}});
    const mx=Math.ceil(Math.max(...ser.map(s=>s.pts[s.pts.length-1]))/20)*20||20;
    h+=card(esc(comp.name)+': poengutvikling','Samlet poengsum for de fem øverste etter hver runde.',lineChart({xs:rounds.map(r=>sd(r.date)),series:ser,min:0,max:mx,yfmt:v=>Math.round(v),vfmt:v=>Math.round(v)+'',label:'Poengutvikling topp fem',tt:i=>(rounds[i].name||'Runde')+' · '+fd(rounds[i].date)})+tableView(['Runde'].concat(ser.map(s=>s.name)),rounds.map((r,i)=>[r.name||'Runde '+(i+1)].concat(ser.map(s=>String(s.pts[i]))))));
  }

  /* heatmap */
  const hc=crit().filter(c=>ps.some(p=>series(p,c.n).length));
  const hp=P.filter(x=>x.n).sort((a,b)=>b.avg-a.avg);
  if(hc.length&&hp.length){
    const cell=v=>v==null?'<div class="c" style="background:var(--fill);color:var(--ter)">·</div>':'<div class="c" title="'+n1(v)+'" style="background:hsl(214 78% '+(96-(v-1)*5.8).toFixed(0)+'%);color:'+(v>=6?'#fff':'#0e1a33')+'">'+n1(v)+'</div>';
    h+='<h2>Spillere × kriterier</h2><div class="tw"><table class="tbl hm"><thead><tr><th>Spiller</th>'+hc.map(c=>'<th>'+esc(c.n)+'</th>').join('')+'</tr></thead><tbody>'+hp.map(x=>'<tr><td><button data-a="openpl" data-id="'+x.p.id+'" style="font:inherit;text-align:left">'+esc(x.p.name)+'</button></td>'+hc.map(c=>'<td>'+cell(series(x.p,c.n).pop())+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="sub" style="margin:6px 16px">Mørkere blå = høyere score. Siste vurdering per kriterium.</div>';
  }

  /* mål og målgivende */
  {const ms=db.matches.filter(m=>m.sport===db.sport);
   const t=sportPl().map(p=>{let g=0,a=0;ms.forEach(m=>{const x=(m.players||{})[p.id]||{};g+=x.goals||0;a+=x.assists||0});return {p,g,a}}).filter(x=>x.g+x.a>0).sort((x,y)=>(y.g+y.a)-(x.g+x.a)||y.g-x.g||x.p.name.localeCompare(y.p.name,'nb'));
   if(t.length)h+=card('Mål og målgivende','Sum fra alle kamper.',hbars(t.map(x=>({l:x.p.name,s:x.g+' mål · '+x.a+' målgivende',v:x.g+x.a})),t[0].g+t[0].a));}
  /* spillertabell */
  if(P.length){
    const srt=P.slice().sort((a,b)=>(b.avg||0)-(a.avg||0));
    h+='<h2>Spillertabell</h2><div class="tw"><table class="tbl"><thead><tr><th>Spiller</th><th>Snitt</th><th>Endring</th><th>Oppmøte</th><th>Innsats kamp</th><th>⚠ 30 d</th></tr></thead><tbody>'+srt.map(x=>'<tr><td><button data-a="openpl" data-id="'+x.p.id+'" style="font:inherit;text-align:left">'+esc(x.p.name)+'</button></td><td>'+f1(x.avg)+'</td><td style="color:var(--'+(x.delta>0?'green':x.delta<0?'red':'sec')+')">'+signed(x.delta)+'</td><td>'+(x.att==null?'–':x.att+' %')+'</td><td>'+f1(x.ef)+'</td><td>'+(x.warn||'–')+'</td></tr>').join('')+'</tbody></table></div>';
  }
  return h;
}

/* ---------- hendelser ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset,b)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qlog'){e.preventDefault();A.logadd()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.type==='range'){const rv=t.closest('.rowc').querySelector('.rv');const m=+t.dataset.min;rv.textContent=+t.value<m?'–':t.value;if(+t.value<m)rv.textContent='–'}
  if(t.dataset.q){Q[t.dataset.q]=t.value;render(true);const n=document.querySelector('[data-q="'+t.dataset.q+'"]');n.focus();n.setSelectionRange(n.value.length,n.value.length)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ch==='cell'){const c=byId(db.comps,R.id);(c.points[t.dataset.p]=c.points[t.dataset.p]||{});if(t.value==='')delete c.points[t.dataset.p][t.dataset.r];else c.points[t.dataset.p][t.dataset.r]=+t.value;save();render(true)}
  if(t.dataset.ch==='import'&&t.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.players||!d.exercises||!d.criteria)throw 0;const fmt=t=>t?new Date(t).toLocaleString('nb-NO'):'ukjent tidspunkt';const older=d.modified&&db.modified&&d.modified<db.modified;if(confirm((older?'ADVARSEL: Sikkerhetskopien ('+fmt(d.modified)+') er ELDRE enn dataene på denne enheten ('+fmt(db.modified)+').\n\n':'')+'Erstatte alle data på denne enheten med sikkerhetskopien fra '+fmt(d.modified)+'?')){try{localStorage.setItem(KEY+'.snap',JSON.stringify(db))}catch(x){}db=migrate(d);save();R={tab:'stat',id:'settings'};render();toast('Gjenopprettet')}}catch(x){toast('Ugyldig fil')}};fr.readAsText(t.files[0]);t.value='';
  }
});
let SWREG=null;
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r=>{SWREG=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;const b=document.createElement('button');b.className='toast';b.style.pointerEvents='auto';b.textContent='Ny versjon er klar – trykk for å laste på nytt';b.onclick=()=>location.reload();document.body.appendChild(b)});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)HID=Date.now();else if(pinGet()&&HID&&Date.now()-HID>60000)lockNow()});
document.addEventListener('keydown',e=>{if(!LOCKED)return;if(/^\d$/.test(e.key))A.pin({id:e.key});else if(e.key==='Backspace')A.pinback()});
applyTheme();
render();
</script>
</body>
